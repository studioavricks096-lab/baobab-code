<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#00c8ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Rooted power for mobile developers." />
  <title>Baobab Code</title>
  <link rel="manifest" href="manifest.json" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets — loaded in order -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/files.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/terminal.css" />
  <link rel="stylesheet" href="css/settings.css" />
</head>
<body>

  <div id="app">

    <!-- Stars background (generated by app.js) -->
    <div id="stars" aria-hidden="true"></div>

    <!-- ── SCREEN SLOTS ─────────────────────────────── -->
    <main id="screen-home"     class="screen" role="main"></main>
    <main id="screen-files"    class="screen" role="main"></main>
    <main id="screen-editor"   class="screen" role="main"></main>
    <main id="screen-terminal" class="screen" role="main"></main>
    <main id="screen-settings" class="screen" role="main"></main>

    <!-- ── BOTTOM NAVIGATION ────────────────────────── -->
    <nav id="bottom-nav" aria-label="Main navigation"></nav>

    <!-- ── GLOBAL OVERLAY (modals / context menus) ── -->
    <div id="overlay" aria-hidden="true"></div>

    <!-- ── MODAL: New File ──────────────────────────── -->
    <div id="modal-new-file" class="modal" role="dialog" aria-modal="true" aria-label="New File">
      <h2 class="modal-title">New File</h2>
      <input id="input-filename" class="modal-input" type="text" placeholder="filename.py" autocomplete="off" spellcheck="false" />
      <div class="modal-actions">
        <button class="modal-btn cancel" id="btn-modal-cancel">Cancel</button>
        <button class="modal-btn confirm" id="btn-modal-create">Create</button>
      </div>
    </div>

    <!-- ── CONTEXT MENU (files) ─────────────────────── -->
    <div id="context-menu" class="ctx-menu" role="menu"></div>

  </div><!-- /#app -->

  <!-- Scripts — order matters -->
  <script src="js/app.js"></script>
  <script src="js/files.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/settings.js"></script>

</body>
</html>
