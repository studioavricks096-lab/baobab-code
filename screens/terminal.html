<div class="terminal-header">
  <div class="terminal-mini-logo">
    <img src="assets/icons/logo.svg" alt="" />
  </div>
  <div class="terminal-tabs" id="terminal-tabs">
    <button class="terminal-tab active" data-tab="python">Python</button>
    <button class="terminal-tab" data-tab="terminal">Terminal</button>
    <button class="terminal-tab" data-tab="stores">Stores</button>
  </div>
  <div class="terminal-run-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    Run
  </div>
</div>

<div class="terminal-filebar">
  <div class="terminal-file-tag" id="terminal-file-tag">
    <svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    <span id="terminal-filename">No file</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><polyline points="6 9 12 15 18 9"/></svg>
  </div>
  <div class="terminal-workspace">
    <span id="terminal-workspace-name">—</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
  </div>
</div>

<div class="terminal-output" id="terminal-output">
  <div class="t-line t-dim">Ready. Open a file and tap Run.</div>
</div>

<div class="terminal-bottom">
  <div class="terminal-bottom-tabs" id="terminal-bottom-tabs">
    <button class="tbt active" data-panel="python">
      <span class="tbt-dot" style="background:var(--accent-green);"></span> Python
    </button>
    <button class="tbt" data-panel="terminal">Terminal</button>
  </div>
  <div class="terminal-result-line" id="terminal-result-line">
    <span>—</span>
  </div>
</div>
