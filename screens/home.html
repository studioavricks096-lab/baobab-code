<div class="home-hero">
  <div class="hero-logo">
    <img src="assets/icons/logo.svg" alt="Baobab Code logo" />
  </div>
  <h1 class="hero-title">Baobab Code</h1>
  <p class="hero-tagline">Rooted power for mobile developers.</p>
</div>

<div class="home-actions">
  <button class="action-btn primary" id="btn-new-file">
    <span class="action-icon">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </span>
    <span>
      <span class="action-label">New File</span>
      <span class="action-sub">Create a new file</span>
    </span>
  </button>

  <button class="action-btn secondary" id="btn-open-project">
    <span class="action-icon">
      <svg viewBox="0 0 24 24" stroke="#0af"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    </span>
    <span>
      <span class="action-label">Open Project</span>
      <span class="action-sub">Browse your projects</span>
    </span>
  </button>

  <button class="action-btn tertiary" id="btn-continue-session">
    <span class="action-icon">
      <svg viewBox="0 0 24 24" stroke="var(--accent-cyan)"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.78"/></svg>
    </span>
    <span>
      <span class="action-label">Continue Last Session</span>
      <span class="action-sub">Resume coding where you left off</span>
    </span>
  </button>
</div>

<p class="section-label" style="padding-top:18px;">Quick Start</p>

<div class="quick-grid">
  <button class="lang-btn" data-lang="python">
    <span class="lang-icon" style="background:#1a1000;">
      <svg viewBox="0 0 32 32" width="24" height="24">
        <path d="M16 4C9 4 9.5 7 9.5 7v3h7v1H7S4 10.5 4 16s3.5 6.5 3.5 6.5H10v-3.1S9.8 16 13 16h6c2.8 0 3-2.8 3-2.8V7.8S22.5 4 16 4z" fill="#3776ab"/>
        <path d="M16 28c7 0 6.5-3 6.5-3v-3h-7v-1h9S28 21.5 28 16s-3.5-6.5-3.5-6.5H22v3.1s.2 3.4-3 3.4h-6c-2.8 0-3 2.8-3 2.8v5.4S9.5 28 16 28z" fill="#ffd43b"/>
        <circle cx="13" cy="7.5" r="1" fill="#ffd43b"/>
        <circle cx="19" cy="24.5" r="1" fill="#3776ab"/>
      </svg>
    </span>
    <span>
      <span class="lang-name">Python</span>
      <span class="lang-sub">.py</span>
    </span>
  </button>

  <button class="lang-btn" data-lang="html">
    <span class="lang-icon" style="background:#1a0800;">
      <svg viewBox="0 0 32 32" width="24" height="24">
        <text x="1" y="14" font-size="9" font-weight="900" fill="#e34c26" font-family="monospace">HTML</text>
        <text x="1" y="26" font-size="8" font-weight="900" fill="#264de4" font-family="monospace">CSS</text>
        <text x="16" y="26" font-size="8" font-weight="900" fill="#f7df1e" font-family="monospace">JS</text>
      </svg>
    </span>
    <span>
      <span class="lang-name">HTML / CSS / JS</span>
      <span class="lang-sub">.html</span>
    </span>
  </button>

  <button class="lang-btn" data-lang="react">
    <span class="lang-icon" style="background:#001828;">
      <svg viewBox="0 0 32 32" width="24" height="24">
        <circle cx="16" cy="16" r="3" fill="#61dafb"/>
        <ellipse cx="16" cy="16" rx="13" ry="5" stroke="#61dafb" stroke-width="1.4" fill="none"/>
        <ellipse cx="16" cy="16" rx="13" ry="5" stroke="#61dafb" stroke-width="1.4" fill="none" transform="rotate(60 16 16)"/>
        <ellipse cx="16" cy="16" rx="13" ry="5" stroke="#61dafb" stroke-width="1.4" fill="none" transform="rotate(120 16 16)"/>
      </svg>
    </span>
    <span>
      <span class="lang-name">React</span>
      <span class="lang-sub">.jsx</span>
    </span>
  </button>

  <button class="lang-btn" data-lang="nodejs">
    <span class="lang-icon" style="background:#001400;">
      <svg viewBox="0 0 32 32" width="24" height="24">
        <path d="M16 3L4 9.5v13L16 29l12-6.5v-13z" stroke="#68a063" stroke-width="1.5" fill="none"/>
        <text x="9" y="20" font-size="9" font-weight="bold" fill="#68a063" font-family="monospace">JS</text>
      </svg>
    </span>
    <span>
      <span class="lang-name">Node.js</span>
      <span class="lang-sub">.js</span>
    </span>
  </button>

  <button class="lang-btn" data-lang="cpp">
    <span class="lang-icon" style="background:#000814;">
      <svg viewBox="0 0 32 32" width="24" height="24">
        <path d="M16 3L5 9v14l11 6 11-6V9z" fill="#004482"/>
        <text x="8" y="20" font-size="9" font-weight="bold" fill="#659ad2" font-family="monospace">C++</text>
      </svg>
    </span>
    <span>
      <span class="lang-name">C++</span>
      <span class="lang-sub">.cpp</span>
    </span>
  </button>

  <button class="lang-btn" data-lang="markdown">
    <span class="lang-icon" style="background:#111;">
      <svg viewBox="0 0 32 32" width="24" height="24">
        <rect x="2" y="6" width="28" height="20" rx="3" fill="#222"/>
        <text x="5" y="21" font-size="15" font-weight="bold" fill="#fff" font-family="serif">M</text>
        <path d="M19 11v10m0-10l3 4 3-4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </svg>
    </span>
    <span>
      <span class="lang-name">Markdown</span>
      <span class="lang-sub">.md</span>
    </span>
  </button>
</div>
