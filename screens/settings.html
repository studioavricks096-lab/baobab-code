<div class="settings-header">
  <button class="icon-btn" id="btn-settings-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <h2 class="settings-title">Settings</h2>
</div>

<!-- Font Size -->
<div class="setting-row">
  <span class="setting-label">Font Size</span>
  <div class="setting-value">
    <span id="setting-font-size">14 px</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
  </div>
</div>

<!-- Code Theme -->
<div class="setting-row" style="align-items:flex-start;">
  <div>
    <div class="setting-label">Code Theme</div>
    <div class="setting-sub" id="setting-theme-name">Savanna Sunset</div>
  </div>
  <div class="theme-thumb">
    <div class="theme-thumb-inner" id="setting-theme-thumb" style="background:linear-gradient(135deg,#c2410c,#1e3a5f);"></div>
  </div>
</div>

<!-- Tab Width -->
<div class="setting-row">
  <span class="setting-label">Tab Width</span>
  <div class="setting-value">
    <span id="setting-tab-width">4 Spaces</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
  </div>
</div>

<!-- Autosave -->
<div class="setting-row">
  <span class="setting-label">Enable Autosave</span>
  <div class="toggle" id="toggle-autosave"></div>
</div>

<!-- Word Wrap -->
<div class="setting-row">
  <span class="setting-label">Word Wrap</span>
  <div class="toggle off" id="toggle-wordwrap"></div>
</div>

<!-- Offline Storage -->
<p class="section-label">Manage Offline Storage</p>

<div class="setting-card">
  <div class="setting-card-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
  </div>
  <div class="setting-card-body">
    <div class="setting-card-label">Signin with Offlub</div>
  </div>
  <div class="setting-card-right">40 pt &rsaquo;</div>
</div>

<div class="setting-card">
  <div class="setting-card-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
  </div>
  <div class="setting-card-body">
    <div class="setting-card-label">Export Backup</div>
  </div>
  <div class="setting-card-right" id="setting-backup-date">—</div>
</div>

<!-- Themes -->
<p class="section-label">Code Theme</p>
<div class="themes-scroll" id="themes-scroll">
  <div class="theme-item" data-theme="savanna">
    <div class="theme-swatch selected"><div class="theme-swatch-fill" style="background:linear-gradient(135deg,#c2410c,#1e3a5f);"></div></div>
    <span class="theme-name">Savanna Disk</span>
  </div>
  <div class="theme-item" data-theme="littor">
    <div class="theme-swatch"><div class="theme-swatch-fill" style="background:linear-gradient(135deg,#1e1b4b,#2e1065);"></div></div>
    <span class="theme-name">Littor Trees</span>
  </div>
  <div class="theme-item" data-theme="ocean">
    <div class="theme-swatch"><div class="theme-swatch-fill" style="background:linear-gradient(135deg,#0f172a,#1e3a5f);"></div></div>
    <span class="theme-name">Deep Ocean</span>
  </div>
  <div class="theme-item" data-theme="forest">
    <div class="theme-swatch"><div class="theme-swatch-fill" style="background:linear-gradient(135deg,#064e3b,#1a2e1a);"></div></div>
    <span class="theme-name">Forest Dark</span>
  </div>
  <div class="theme-item" data-theme="earth">
    <div class="theme-swatch"><div class="theme-swatch-fill" style="background:linear-gradient(135deg,#14532d,#052e16);"></div></div>
    <span class="theme-name">Earth Green</span>
  </div>
</div>

<!-- App version -->
<div class="setting-row" style="margin-top:8px;">
  <span class="setting-label" style="color:var(--text-muted);font-size:13px;">Baobab Code</span>
  <span class="setting-value" style="font-size:12px;">v1.0.0 — Stage 1</span>
</div>
